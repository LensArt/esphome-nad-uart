esphome:
  name: nad-amplifier-remote
  friendly_name: NAD amplifier remote

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

logger:
  level: INFO

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

uart:
  id: uart_bus
  tx_pin: D8
  rx_pin: D7
  baud_rate: 115200

  debug:
    direction: BOTH
    after:
      delimiter: "\n"
    sequence:
      - lambda: UARTDebug::log_string(direction, bytes);

external_components:
  - source:
      type: git
      url: https://github.com/wez/ESPHome-UART-Read-Line-Sensor
    components:
      - uart_read_line_sensor


interval:
  - interval: 300s
    then:
      - uart.write: "\rMain.Power?\r"
      - delay: 200ms
      - uart.write: "\rMain.Mute?\r"
      - delay: 200ms
      - uart.write: "\rMain.SpeakerA?\r"
      - delay: 200ms
      - uart.write: "\rMain.SpeakerB?\r"
      - delay: 200ms
      - uart.write: "\rMain.Source?\r"


text_sensor:

  - platform: uart_read_line_sensor
    name: "Last UART Line"
    id: nad_uart

    uart_id: uart_bus

    on_value:
      then:
        - lambda: |-

            std::string line = x;

            line.erase(std::remove(line.begin(), line.end(), '\r'), line.end());
            line.erase(std::remove(line.begin(), line.end(), '\n'), line.end());

            size_t eq = line.find("=");
            if (eq == std::string::npos) return;

            std::string key = line.substr(0, eq);
            std::string value = line.substr(eq + 1);

            std::transform(key.begin(), key.end(), key.begin(), ::tolower);

            ESP_LOGI("NAD", "key=%s value=%s", key.c_str(), value.c_str());

            bool state = (value == "On");

            if (key == "main.power")
              id(power).publish_state(state);

            else if (key == "main.mute")
              id(mute).publish_state(state);

            else if (key == "main.speakera")
              id(speaker_a).publish_state(state);

            else if (key == "main.speakerb")
              id(speaker_b).publish_state(state);

            else if (key == "main.source")
              id(source).publish_state(value);


switch:
  - platform: template
    name: "Power"
    icon: mdi:power
    id: power

    turn_on_action:
      - uart.write: "\rMain.Power=On\r"

    turn_off_action:
      - uart.write: "\rMain.Power=Off\r"


  - platform: template
    name: "Mute"
    icon: mdi:volume-mute
    id: mute

    turn_on_action:
      - uart.write: "\rMain.Mute=On\r"

    turn_off_action:
      - uart.write: "\rMain.Mute=Off\r"


  - platform: template
    name: "Speaker A"
    icon: mdi:speaker
    id: speaker_a

    turn_on_action:
      - uart.write: "\rMain.SpeakerA=On\r"

    turn_off_action:
      - uart.write: "\rMain.SpeakerA=Off\r"


  - platform: template
    name: "Speaker B"
    icon: mdi:speaker
    id: speaker_b

    turn_on_action:
      - uart.write: "\rMain.SpeakerB=On\r"

    turn_off_action:
      - uart.write: "\rMain.SpeakerB=Off\r"


button:
  - platform: template
    name: "Volume Up"
    icon: mdi:volume-plus

    on_press:
      - uart.write: "\rMain.Volume+\r"


  - platform: template
    name: "Volume Down"
    icon: mdi:volume-minus

    on_press:
      - uart.write: "\rMain.Volume-\r"


select:
  - platform: template
    name: "Source"
    id: source

    options:
      - CD
      - TUNER
      - AUX
      - MP
      - DISC/MDC
      - TAPE2

    set_action:
      - lambda: |-
          std::string cmd = "\rMain.Source=" + x + "\r";
          id(uart_bus).write_str(cmd.c_str());