esphome:
  name: nad-amplifier-remote
  friendly_name: NAD amplifier remote

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true

logger:
  level: ERROR
  baud_rate: 0

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

uart:
  id: uart_bus
  tx_pin: D8
  rx_pin: D7
  baud_rate: 115200

  debug:
    direction: BOTH
    after:
      delimiter: "\n"
    sequence:
      - lambda: UARTDebug::log_string(direction, bytes);

external_components:
  - source:
      type: git
      url: https://github.com/wez/ESPHome-UART-Read-Line-Sensor
    components:
      - uart_read_line_sensor


interval:
  - interval: 300s
    then:
      - uart.write: "\rMain.Power?\r"
      - delay: 200ms
      - uart.write: "\rMain.Mute?\r"
      - delay: 200ms
      - uart.write: "\rMain.SpeakerA?\r"
      - delay: 200ms
      - uart.write: "\rMain.SpeakerB?\r"
      - delay: 200ms
      - uart.write: "\rMain.Source?\r"


text_sensor:
  - platform: uart_read_line_sensor
    uart_id: uart_bus
    name: "Last UART Line"
    id: last_uart_line

    on_value:
      then:
        - lambda: |-
            const char *line = x.c_str();

            const char *eq = strchr(line, '=');
            if (!eq) return;

            int key_len = eq - line;
            const char *value = eq + 1;

            bool is_on = strcasecmp(value, "On") == 0;

            if (strncasecmp(line, "Main.Power", key_len) == 0) {
              id(power).publish_state(is_on);
              return;
            }

            if (strncasecmp(line, "Main.Mute", key_len) == 0) {
              id(mute).publish_state(is_on);
              return;
            }

            if (strncasecmp(line, "Main.SpeakerA", key_len) == 0) {
              id(speaker_a).publish_state(is_on);
              return;
            }

            if (strncasecmp(line, "Main.SpeakerB", key_len) == 0) {
              id(speaker_b).publish_state(is_on);
              return;
            }

            if (strncasecmp(line, "Main.Source", key_len) == 0) {
              id(source).publish_state(value);
              return;
            }


switch:
  - platform: template
    name: "Power"
    icon: mdi:power
    id: power

    turn_on_action:
      - uart.write: "\rMain.Power=On\r"

    turn_off_action:
      - uart.write: "\rMain.Power=Off\r"


  - platform: template
    name: "Mute"
    icon: mdi:volume-mute
    id: mute

    turn_on_action:
      - uart.write: "\rMain.Mute=On\r"

    turn_off_action:
      - uart.write: "\rMain.Mute=Off\r"


  - platform: template
    name: "Speaker A"
    icon: mdi:speaker
    id: speaker_a

    turn_on_action:
      - uart.write: "\rMain.SpeakerA=On\r"

    turn_off_action:
      - uart.write: "\rMain.SpeakerA=Off\r"


  - platform: template
    name: "Speaker B"
    icon: mdi:speaker
    id: speaker_b

    turn_on_action:
      - uart.write: "\rMain.SpeakerB=On\r"

    turn_off_action:
      - uart.write: "\rMain.SpeakerB=Off\r"


button:
  - platform: template
    name: "Volume Up"
    icon: mdi:volume-plus

    on_press:
      - uart.write: "\rMain.Volume+\r"


  - platform: template
    name: "Volume Down"
    icon: mdi:volume-minus

    on_press:
      - uart.write: "\rMain.Volume-\r"


select:
  - platform: template
    name: "Source"
    id: source

    options:
      - CD
      - TUNER
      - AUX
      - MP
      - DISC/MDC
      - TAPE2

    set_action:
      - lambda: |-
          std::string cmd = "\rMain.Source=" + x + "\r";
          id(uart_bus).write_str(cmd.c_str());