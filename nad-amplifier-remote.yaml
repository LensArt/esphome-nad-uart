esphome:
  name: nad-amplifier-remote
  friendly_name: NAD amplifier remote

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: VERY_VERBOSE
  # baud_rate: 0

api:

uart:
  id: uart_bus
  tx_pin: D8
  rx_pin: D7
  baud_rate: 115200
  stop_bits: 1

  debug:
    direction: BOTH
    after:
      delimiter: "\n"
    sequence:
      - lambda: UARTDebug::log_string(direction, bytes);

external_components:
  - source:
      type: git
      url: https://github.com/wez/ESPHome-UART-Read-Line-Sensor
    components:
      - uart_read_line_sensor

text_sensor:

  - platform: uart_read_line_sensor
    uart_id: uart_bus
    name: "Last UART Line"
    id: last_uart_line

    on_value:
      then:
        - lambda: |-
            size_t eq = x.find("=");
            if (eq == std::string::npos) {
              return;
            }

            std::string key = x.substr(0, eq);
            std::string value = x.substr(eq + 1);

            ESP_LOGI("NAD", "key='%s' value='%s'", key.c_str(), value.c_str());

  - platform: template
    name: "Model"
    id: nad_model

button:

  - platform: template
    name: "Volume Up"
    icon: mdi:volume-plus
    on_press:
      - uart.write: "\rMain.Volume+\r"

  - platform: template
    name: "Volume Down"
    icon: mdi:volume-minus
    on_press:
      - uart.write: "\rMain.Volume-\r"

switch:

  - platform: template
    name: "Power"
    icon: mdi:power

    turn_on_action:
      - uart.write: "\rMain.Power=On\r"

    turn_off_action:
      - uart.write: "\rMain.Power=Off\r"

  - platform: template
    name: "Mute"
    icon: mdi:volume-mute

    turn_on_action:
      - uart.write: "\rMain.Mute=On\r"

    turn_off_action:
      - uart.write: "\rMain.Mute=Off\r"

  - platform: template
    name: "Speaker A"
    icon: mdi:speaker-wireless

    turn_on_action:
      - uart.write: "\rMain.SpeakerA=On\r"

    turn_off_action:
      - uart.write: "\rMain.SpeakerA=Off\r"

  - platform: template
    name: "Speaker B"
    icon: mdi:speaker-wireless

    turn_on_action:
      - uart.write: "\rMain.SpeakerB=On\r"

    turn_off_action:
      - uart.write: "\rMain.SpeakerB=Off\r"

select:
  - platform: template
    name: "Source"
    icon: mdi:source-input-hdmi

    options:
      - "CD"
      - "TUNER"
      - "AUX"
      - "MP"
      - "DISC/MDC"
      - "TAPE2"

    set_action:
      - lambda: |-
          std::string cmd = "\rMain.Source=" + x + "\r";
          id(uart_bus).write_str(cmd.c_str());