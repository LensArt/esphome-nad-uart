esphome:
  name: nad-amplifier-remote
  friendly_name: NAD amplifier remote

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

logger:
  level: DEBUG
  baud_rate: 115200

api:
  reboot_timeout: 0s

ota:
  platform: esphome

uart:
  id: uart_bus
  tx_pin: D8
  rx_pin: D7
  baud_rate: 115200

  debug:
    direction: RX
    after:
      delimiter: "\r"
    sequence:
      - lambda: |-
          std::string line(bytes.begin(), bytes.end());

          size_t eq = line.find('=');
          if (eq == std::string::npos) return;

          std::string key = line.substr(0, eq);
          std::string value = line.substr(eq + 1);

          ESP_LOGI("NAD", "key=%s value=%s", key.c_str(), value.c_str());

          if (key == "Main.Power") {
            id(power_switch).publish_state(value == "On");
          }

          if (key == "Main.Mute") {
            id(mute_switch).publish_state(value == "On");
          }

          if (key == "Main.SpeakerA") {
            id(speaker_a_switch).publish_state(value == "On");
          }

          if (key == "Main.SpeakerB") {
            id(speaker_b_switch).publish_state(value == "On");
          }

          if (key == "Main.Source") {
            id(source_select).publish_state(value);
          }

interval:
  - interval: 300s
    then:
      - uart.write: "\rMain.Power?\r"
      - delay: 200ms
      - uart.write: "\rMain.Mute?\r"
      - delay: 200ms
      - uart.write: "\rMain.SpeakerA?\r"
      - delay: 200ms
      - uart.write: "\rMain.SpeakerB?\r"
      - delay: 200ms
      - uart.write: "\rMain.Source?\r"

switch:
  - platform: template
    name: "Power"
    icon: mdi:power
    id: power_switch

    turn_on_action:
      - uart.write: "\rMain.Power=On\r"

    turn_off_action:
      - uart.write: "\rMain.Power=Off\r"

  - platform: template
    name: "Mute"
    icon: mdi:volume-mute
    id: mute_switch

    turn_on_action:
      - uart.write: "\rMain.Mute=On\r"

    turn_off_action:
      - uart.write: "\rMain.Mute=Off\r"

  - platform: template
    name: "Speaker A"
    icon: mdi:speaker
    id: speaker_a_switch

    turn_on_action:
      - uart.write: "\rMain.SpeakerA=On\r"

    turn_off_action:
      - uart.write: "\rMain.SpeakerA=Off\r"

  - platform: template
    name: "Speaker B"
    icon: mdi:speaker
    id: speaker_b_switch

    turn_on_action:
      - uart.write: "\rMain.SpeakerB=On\r"

    turn_off_action:
      - uart.write: "\rMain.SpeakerB=Off\r"

button:
  - platform: template
    name: "Volume Up"
    icon: mdi:volume-plus
    on_press:
      - uart.write: "\rMain.Volume+\r"

  - platform: template
    name: "Volume Down"
    icon: mdi:volume-minus
    on_press:
      - uart.write: "\rMain.Volume-\r"

select:
  - platform: template
    name: "Source"
    id: source_select

    options:
      - CD
      - TUNER
      - AUX
      - MP
      - DISC/MDC
      - TAPE2

    set_action:
      - lambda: |-
          std::string cmd = "\rMain.Source=" + x + "\r";
          id(uart_bus).write_str(cmd.c_str());